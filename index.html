<!DOCTYPE html>
<html>

<head>
    <title>MONDONGITO</title>

    <style>

        body{
            margin:0;
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(45deg,#ff758c,#ff7eb3,#8e2de2);
            font-family:Arial, sans-serif;
            overflow:hidden;
        }


        .tarjeta{

            background:white;
            width:400px;
            padding:40px;
            border-radius:30px;
            text-align:center;

            box-shadow:0 0 30px rgba(255,255,255,0.7);

            animation:aparecer 2s;

        }


        h1{

            color:#ff3366;
            font-size:45px;

            animation:brillo 2s infinite alternate;

        }


        p{

            color:#555;
            font-size:22px;

        }


        button{

            background:#ff3366;
            color:white;

            border:none;

            padding:15px 40px;

            border-radius:30px;

            font-size:20px;

            cursor:pointer;

            transition:0.3s;

        }


        button:hover{

            transform:scale(1.2);

            background:#ff0055;

        }



        .corazon{

            position:absolute;

            color:white;

            font-size:30px;

            animation:flotar 5s infinite;

        }



        @keyframes aparecer{

            from{

                opacity:0;
                transform:translateY(-100px);

            }

            to{

                opacity:1;
                transform:translateY(0);

            }

        }



        @keyframes brillo{

            from{

                text-shadow:0 0 5px red;

            }

            to{

                text-shadow:0 0 30px pink;

            }

        }



        @keyframes flotar{

            from{

                transform:translateY(100vh);

                opacity:1;

            }

            to{

                transform:translateY(-100vh);

                opacity:0;

            }

        }


    </style>

</head>


<body>


<div class="tarjeta">


<h1>Hola ❤️</h1>


<p>
monjaaaaaaaaaaaaaa!!!!
</p>


<button onclick="mensaje()">

Presiona aquí 💖

</button>


</div>



<div class="corazon" style="left:10%;">❤️</div>
<div class="corazon" style="left:30%;animation-delay:2s;">💖</div>
<div class="corazon" style="left:70%;animation-delay:1s;">💕</div>
<div class="corazon" style="left:90%;animation-delay:3s;">❤️</div>



<script>

function mensaje(){

alert(" jejee gracias por lo de hoy te quiero <3 no te iluciones 7w7 ");

}

</script>


</body>

</html>
